[project]
name = "apk-build"
version = "0.1.0"
description = "Compiles, packages, and signs Android APKs directly on Android via Termux"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
apk = "apk_build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
